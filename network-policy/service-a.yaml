---
apiVersion: v1
kind: Namespace
metadata:
  name: service-a
  labels:
    app: service-a
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: service-a
  labels:
    app: service-a
  namespace: service-a
data:
  index.html: |
    "/" on service-a  
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: service-a-nginx.conf
  labels:
    app: service-a
  namespace: service-a
data:
  nginx.conf: |
    user  nginx;
    worker_processes  1;
    error_log  /var/log/nginx/error.log warn;
    pid        /var/run/nginx.pid;
    events {
        worker_connections  1024;
    }

    http {
        sendfile       on;
        server {
          listen       80;
          server_name  localhost;

          location / {
              root   /usr/share/nginx/html;
              index  index.html index.htm;
          }

          error_page 404 /404.html;
          error_page   500 502 503 504  /50x.html;
          location = /50x.html {
              root   /usr/share/nginx/html;
          }
        }
    }
---
apiVersion: v1
kind: Pod
metadata:
  labels:
    app: service-a
  name: service-a
  namespace: service-a
spec:
  volumes:
  - name: html
    configMap:
      name: service-a
  - name: config
    configMap:
      name: service-a-nginx.conf
  containers:
  - image: nginx
    name: nginx-pod
    ports:
    - containerPort: 80
    volumeMounts:
    - name: html
      mountPath: /usr/share/nginx/html/
    - name: config
      mountPath: /etc/nginx/
---
apiVersion: v1
kind: Service
metadata:
  name: service-a
  labels:
    app: service-a
  namespace: service-a
spec:
  selector:
    app: service-a
  ports:
    - protocol: TCP
      port: 80
      targetPort: 80
---