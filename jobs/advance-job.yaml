apiVersion: batch/v1
kind: Job
metadata:
  name: advanced-indexed-job
  labels:
    app: advanced-indexed-job
spec:
  completions: 10
  parallelism: 3
  completionMode: Indexed
  backoffLimitPerIndex: 1
  maxFailedIndexes: 2
  activeDeadlineSeconds: 600
  ttlSecondsAfterFinished: 120
  template:
    metadata:
      labels:
        app: advanced-indexed-job
    spec:
      restartPolicy: Never
      terminationGracePeriodSeconds: 10
      containers:
        - name: worker
          image: busybox:1.36
          imagePullPolicy: IfNotPresent
          command:
            - sh
            - -c
            - |
              echo "Job index: ${JOB_COMPLETION_INDEX}"
              echo "Pod name: ${HOSTNAME}"

              # Simulate variable work time
              sleep $(( (${JOB_COMPLETION_INDEX} % 3) + 1 ))

              # Fail selected indexes to demonstrate per-index retries
              if [ "${JOB_COMPLETION_INDEX}" = "4" ] || [ "${JOB_COMPLETION_INDEX}" = "7" ]; then
                echo "Intentional failure for index ${JOB_COMPLETION_INDEX}"
                exit 1
              fi

              echo "Index ${JOB_COMPLETION_INDEX} completed successfully"
          resources:
            requests:
              cpu: "50m"
              memory: "64Mi"
            limits:
              cpu: "50m"
              memory: "64Mi"
